# Global workflow: one per machine, at ~/.config/orchestration/workflow.yaml
# PROTOTYPE (#128). Reproduces v1's ticket pipeline as data. Throwaway.
version: 1

# A repair edge spends one slot of a named budget each time it is taken.
# A spent budget blocks the ticket for a human. Nothing refills it.
budgets:
  bounces:    { max: 3 }   # review -> fix, plus anything a project adds that shares it
  ci_repairs: { max: 2 }   # ci -> fix

settings:                  # defaults a project override may change
  merge: auto              # auto | human

steps:
  - id: spec
    kind: agent
    runner: pi
    options: { agent: spec-writer }

  - id: tests
    kind: agent
    runner: pi
    options: { agent: test-writer }
    when: lane not in [trivial, no-code]
    gate: tests-red        # red for the right reason, or the ticket blocks

  - id: implement
    kind: agent
    runner: pi
    options: { agent: implementor }
    gate: tests-green      # no handoff with any red test

  - id: review
    kind: agent
    runner: pi
    options: { agent: reviewer }
    when: lane != trivial
    on:
      findings: { repair: fix, budget: bounces }   # run fix, then run review again

  - id: fix
    kind: agent
    runner: pi
    options: { agent: implementor, fresh: true }
    trigger: repair        # never runs in the plain walk; only through a repair edge
    gate: tests-green

  - id: report
    kind: agent
    runner: pi
    options: { agent: reporter }

  - id: mr                 # commit, rebase onto base, push, open the MR or PR
    kind: mr

  - id: ci                 # watch CI on the head commit
    kind: ci
    gate: ci-green-on-head # the verdict must be for the exact head SHA
    on:
      failed: { repair: fix, budget: ci_repairs }

  - id: merge              # squash-merge, pinned to the SHA ci passed on
    kind: merge
    when: settings.merge == auto
    else: { block: awaiting human merge }
