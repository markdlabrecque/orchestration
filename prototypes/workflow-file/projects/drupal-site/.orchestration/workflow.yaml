# Project override for a Drupal site, committed at <repo>/.orchestration/workflow.yaml
# PROTOTYPE (#128), round 2. Throwaway.
version: 1
extends: global            # or `from: scratch` with a full `steps:` list

uses:
  - ./.orchestration/steps/a11y-scan.step.ts   # registers step kind a11y-scan

settings:
  verification: ddev       # switches the global verify step on, against the ticket's DDEV site
  merge: human             # a person presses merge on client sites

patch:
  - insert_after: spec     # the same human kind, used as an early gate
    step:
      id: spec-approval
      kind: human
      options: { ask: "Spec is written. OK to build it?" }

  - insert_before: verify
    step:
      id: ddev-up
      kind: shell
      options: { command: "ddev start && ddev drush cim -y" }
      when: lane == standard

  - insert_after: verify
    step:
      id: a11y
      kind: a11y-scan
      options: { pages: ["/", "/node/1"], standard: WCAG2AA }
      when: lane == standard
      on:
        violations: { repair: fix, budget: bounces }
